[package]
name = "better-iam-oauth"
description = "OAuth 2.0 and OpenID Connect for Better IAM (Rust): sign-in with Google, GitHub, Entra ID, or any OIDC provider, a tenant-aware authorization server, resource-server token verification, and a Shared Signals transmitter, sharing its records with the TypeScript implementation."
readme = "README.md"
keywords = ["iam", "oauth2", "oidc", "openid-connect", "authorization-server"]
categories = ["authentication", "web-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Implements `better_iam_server::http::ProtocolService` for the provider and the login service, and builds the
# provider host from `iam.protocol_host()`.
server = ["dep:better-iam-server"]

[dependencies]
better-iam-core.workspace = true
better-iam-auth.workspace = true
better-iam-server = { workspace = true, optional = true }
async-trait.workspace = true
futures.workspace = true
indexmap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
bytes.workspace = true
http = "1"
aes-gcm = "0.10"
base64 = "0.22"
hmac = "0.12"
sha1 = "0.10"
subtle = "2"
rand = "0.8"
url = "2"
uuid = { version = "1", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
p521 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }

[dev-dependencies]
better-iam-adapter-sqlite.workspace = true
better-iam-server.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[lib]
doctest = false
