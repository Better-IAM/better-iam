[package]
name = "better-iam-types"
description = "Typed request, response and model types of the Better IAM HTTP API for Rust, generated from its OpenAPI document, plus the route table shared by the server and the client."
readme = "README.md"
keywords = ["iam", "authorization", "openapi", "api", "types"]
categories = ["authentication", "api-bindings", "data-structures"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
better-iam-core.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lib]
# The generated doc comments quote the TypeScript documentation, whose code samples are not Rust.
doctest = false
