[package]
name = "better-iam-adapter-postgres"
description = "PostgreSQL storage adapter for Better IAM (Rust), sharing its database format with the TypeScript adapter."
readme = "README.md"
keywords = ["iam", "postgres", "database-adapter", "authorization", "access-control"]
categories = ["database", "authentication"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
better-iam-core.workspace = true
bytes.workspace = true
deadpool-postgres.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tokio-postgres.workspace = true
tokio-postgres-rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
better-iam-core = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-postgres.workspace = true
