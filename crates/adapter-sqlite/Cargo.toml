[package]
name = "better-iam-adapter-sqlite"
description = "SQLite storage adapter for Better IAM (Rust), sharing its database format with the TypeScript adapter."
readme = "README.md"
keywords = ["iam", "sqlite", "database-adapter", "authorization", "access-control"]
categories = ["database", "authentication"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
better-iam-core.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }

[dev-dependencies]
better-iam-core = { workspace = true, features = ["conformance"] }
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
