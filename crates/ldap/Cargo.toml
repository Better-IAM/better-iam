[package]
name = "better-iam-ldap"
description = "A read-only LDAPv3 directory gateway over Better IAM (Rust): people, groups and password binds for applications that only speak LDAP, sharing its records with the TypeScript implementation."
readme = "README.md"
keywords = ["iam", "ldap", "ldaps", "directory", "rfc4511"]
categories = ["authentication", "network-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
# Implements `LdapIam` for a `better_iam_server::BetterIam` instance (`ServerLdapIam`).
server = ["dep:better-iam-server", "dep:better-iam-auth"]

[dependencies]
better-iam-core.workspace = true
better-iam-server = { workspace = true, optional = true }
better-iam-auth = { workspace = true, optional = true }
async-trait.workspace = true
indexmap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[dev-dependencies]
better-iam-ldap = { path = ".", features = ["server"] }
better-iam-adapter-sqlite.workspace = true
better-iam-server.workspace = true
bytes.workspace = true
http = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[lib]
doctest = false




