[package]
name = "better-iam"
description = "Better IAM for Rust in one dependency: the server, core, authentication, storage adapters, the typed HTTP client and the projects plugin, re-exported behind features, sharing its database with the TypeScript implementation."
readme = "README.md"
keywords = ["iam", "authentication", "authorization", "rbac", "multi-tenant"]
categories = ["authentication", "web-programming"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["server", "auth", "sqlite", "client", "projects"]
# The server (`better_iam`, `BetterIam`, the decision engine and the HTTP API) and the root re-exports of the
# TypeScript umbrella's index.
server = ["dep:better-iam-server", "types"]
# Tenant-scoped authentication (`better-iam/auth`, `better-iam/auth/templates`).
auth = ["dep:better-iam-auth"]
# The API request, result and model types (`better-iam-types`).
types = ["dep:better-iam-types"]
# Storage adapters (`better-iam/adapter-sqlite`, `-postgres`, `-libsql`).
sqlite = ["dep:better-iam-adapter-sqlite"]
postgres = ["dep:better-iam-adapter-postgres"]
libsql = ["dep:better-iam-adapter-libsql"]
# The typed HTTP client with its session store and device proofs (`better-iam/client`).
client = ["dep:better-iam-client", "types"]
# The projects reference plugin (`better-iam/projects`).
projects = ["dep:better-iam-projects"]

[dependencies]
better-iam-core.workspace = true
better-iam-server = { workspace = true, optional = true }
better-iam-auth = { workspace = true, optional = true }
better-iam-types = { workspace = true, optional = true }
better-iam-adapter-sqlite = { workspace = true, optional = true }
better-iam-adapter-postgres = { workspace = true, optional = true }
better-iam-adapter-libsql = { workspace = true, optional = true }
better-iam-client = { workspace = true, optional = true }
better-iam-projects = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[lib]
doctest = false
